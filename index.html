<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Expense</h1>
        <div class="maincontainer" id="board">
            <div class="netamount">
                <h2>your balance</h2>
                <p id="current-bal">$0.00</p>
            </div>
            <div class="summery" id="summery1">
                <div class="income">
                    <h3>income</h3>
                    <p id="current-income">$0.00</p>
                </div>
                <div class="expense">
                    <h3>Expense</h3>
                    <p id="current-expense">$0.00</p>
                </div>
            </div>


        </div>
        <div class="main-content">
            <div class="transaction-container ">
                <h2>Transaction</h2>
                <ul id="transaction-list" >
                <!-- transaction inserted -->

                </ul>
                            </div>
            <div class="add-transaction">
                <!-- <h2>Add Transaction</h2> -->
                <form id="transaction-form">
                    <h2>Add Transaction</h2>
                    <div class="form-group">
                     <label for="description">Description</label>
                     <input type="text" id="description" placeholder="Enter Description" required/>
                    </div>
                    <div class="form-group">
                        <label for="Amount">Amount</label>
                     <input type="number" id="Amount" placeholder="Enter amount" required/>
                     <small>Use minus (-) for Expenses</small>

                    </div>

                   <button type="submit" id="add-btn">Add Transaction</button>
                    
                </form>
            </div>
        </div>

    </div>
     <!-- <script src="sc.js"></script> -->

    <script src="script.js"></script>
</body>
</html>
